services:
  xianxia-engine:
    build:
      context: .
      dockerfile: go_core/Dockerfile
    container_name: xianxia-game-engine
    labels:
      xianxia.release: "0.35.0"
    restart: unless-stopped
    # The engine drains in-flight requests on SIGTERM (default 20s, see
    # ENGINE_SHUTDOWN_GRACE_SECONDS). Docker's default grace is 10s, which
    # would SIGKILL it mid-drain - and mid-restore, which holds the
    # maintenance barrier for its whole duration.
    stop_grace_period: 30s
    environment:
      ENGINE_ADDR: ":8081"
      DATABASE_PATH: "/data/xianxia.sqlite3"
      WORLD_DATA_PATH: "/app/content/world.json"
      ENGINE_AUTH_TOKEN: "${ENGINE_AUTH_TOKEN:-}"
      # Backups (v0.32.0): retention, size cap and the optional key that
      # seals every backup. docs/CONFIGURATION.md, "Backups".
      XIANXIA_BACKUP_KEEP_DAILY: "${XIANXIA_BACKUP_KEEP_DAILY:-14}"
      XIANXIA_BACKUP_KEEP_WEEKLY: "${XIANXIA_BACKUP_KEEP_WEEKLY:-8}"
      XIANXIA_BACKUP_MAX_MB: "${XIANXIA_BACKUP_MAX_MB:-0}"
      XIANXIA_BACKUP_KEY: "${XIANXIA_BACKUP_KEY:-}"
    volumes:
      - ./data:/data
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  xianxia-db-init:
    build: .
    container_name: xianxia-db-init
    restart: "no"
    env_file:
      - .env
    depends_on:
      xianxia-engine:
        condition: service_healthy
    environment:
      GAME_ENGINE_URL: "http://xianxia-engine:8081"
    command: ["python", "-m", "app.database.bootstrap"]

  xianxia-bot:
    build: .
    container_name: xianxia-roleplay-bot
    labels:
      xianxia.release: "0.35.0"
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      xianxia-engine:
        condition: service_healthy
      xianxia-db-init:
        condition: service_completed_successfully
    environment:
      GAME_ENGINE_URL: "http://xianxia-engine:8081"
      # The health/control listener defaults to loopback (v0.29.0). Here it
      # must answer the dashboard container over the compose network, and
      # `expose` keeps it off the host, so all interfaces is the right bind
      # inside this container and only here.
      HEALTH_HOST: "0.0.0.0"
      # Pinned here so it cannot drift from the dashboard's BOT_CONTROL_URL
      # below when an older .env still says 8080 (the QTS admin port; moved in
      # v0.29.0). expose-only, so it never meets the host's 8080 anyway.
      HEALTH_PORT: "8082"
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "python", "-m", "app.ops.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  xianxia-dashboard:
    build: .
    container_name: xianxia-rp-dashboard
    profiles:
      - dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      xianxia-engine:
        condition: service_healthy
      xianxia-db-init:
        condition: service_completed_successfully
      xianxia-bot:
        condition: service_healthy
    environment:
      GAME_ENGINE_URL: "http://xianxia-engine:8081"
      BOT_CONTROL_URL: "http://xianxia-bot:8082"
      # Defaults to loopback (v0.29.0); inside the container it must bind all
      # interfaces for the `ports` line below to reach it. Which host
      # interface that port is published on is DASHBOARD_BIND_ADDRESS.
      DASHBOARD_HOST: "0.0.0.0"
    command: ["python", "-m", "app.dashboard"]
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/livez', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
