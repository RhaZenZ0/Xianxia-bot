name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app scripts
      - run: python -m pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go_core/go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - run: test -z "$(gofmt -l go_core)"
      - run: cd go_core && CGO_ENABLED=1 go vet ./...
      - run: cd go_core && CGO_ENABLED=1 go test ./...

  containers:
    runs-on: ubuntu-latest
    needs: [python, go]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t xianxia-bot:ci .
      - run: docker build -f go_core/Dockerfile -t xianxia-engine:ci .